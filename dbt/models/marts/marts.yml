version: 2

models:
  - name: fct_daily_fraud
    description: Gian lận theo ngày (một dòng = một ngày x train/test)
    columns:
      - name: event_date
        data_tests: [not_null]
      - name: split
        data_tests:
          - accepted_values:
              arguments:
                values: ["train", "test"]

  - name: dim_card_risk
    description: Hồ sơ rủi ro theo thẻ (đã che số thẻ)
    columns:
      - name: card_token
        data_tests: [not_null, unique]
      - name: risk_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["compromised", "watch", "normal"]

  - name: agg_category_month
    description: Danh mục x tháng
    columns:
      - name: month_start
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]

  - name: fct_stream_latency
    description: Độ trễ Kafka -> Silver (p50/p95) theo từng giờ chạy thật
    columns:
      - name: hour_start
        data_tests: [not_null, unique]

  - name: fct_alert_queue
    description: 500 cảnh báo điểm cao nhất trên TEST, kèm lý do
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]

  - name: fct_compaction
    description: Số file và thời gian truy vấn trước/sau lần gộp file thật của từng bảng

  - name: kpi_summary
    description: Một dòng các con số chính cho dashboard
