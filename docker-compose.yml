# =============================================================================
# Real-time Banking Lakehouse — toàn bộ hệ thống chạy local.
#
# Các nhóm service (profile):
#   (mặc định)  hạ tầng: kho S3, Nessie + Postgres, Kafka, Trino
#   realtime    producer + 2 Spark job streaming (Bronze, Silver) tự chạy, tự khởi động lại
#   jobs        chạy một lần: unit test (spark-tools), nạp lịch sử (backfill)
#
#   docker compose up -d                          # chỉ hạ tầng
#   docker compose --profile realtime up -d       # hạ tầng + luồng realtime
#   docker compose --profile jobs run --rm spark-tools          # chạy unit test
#   docker compose --profile realtime down        # tắt, giữ dữ liệu
#   docker compose --profile realtime down -v     # tắt và XÓA toàn bộ dữ liệu
#
# Mọi image đều ghim phiên bản cụ thể để lần chạy nào cũng giống nhau.
# RAM ước tính: hạ tầng ~4,5 GB; thêm realtime ~4 GB.
# =============================================================================

name: realtime-banking-lakehouse

x-spark: &spark
  image: lakehouse-spark:3.5.9-iceberg1.10.0
  build:
    context: .
    dockerfile: docker/spark/Dockerfile
  environment: &spark-env
    AWS_ACCESS_KEY_ID: admin
    AWS_SECRET_ACCESS_KEY: password
    AWS_REGION: us-east-1
    KAFKA_BOOTSTRAP: kafka:29092
    CHECKPOINT_ROOT: /opt/spark/checkpoints
  volumes:
    # Gắn code từ máy vào container: sửa code xong chỉ cần restart, không cần build lại
    - ./spark_jobs:/opt/app/spark_jobs:ro
    - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - spark-checkpoints:/opt/spark/checkpoints
  networks: [lakehouse]

services:

  # ===========================================================================
  # HẠ TẦNG
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Kho lưu file tương thích S3 (RustFS). Giao diện web: http://localhost:9001
  # Alias "minio" giữ cho mọi cấu hình gọi http://minio:9000 như với MinIO.
  # ---------------------------------------------------------------------------
  object-store:
    image: rustfs/rustfs:1.0.0
    container_name: object-store
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_SERVER_DOMAINS: minio
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # giao diện web
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped
    networks:
      lakehouse:
        aliases: [minio, warehouse.minio]

  # Chạy 1 lần để tạo bucket "warehouse", rồi tự tắt.
  create-bucket:
    image: rustfs/rustfs:1.0.0
    container_name: create-bucket
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        curl -sf -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user admin:password
        --head http://object-store:9000/warehouse ||
        curl -sSf --aws-sigv4 aws:amz:us-east-1:s3 --user admin:password
        -X PUT http://object-store:9000/warehouse
        && echo 'Bucket warehouse da san sang'
    restart: "no"
    networks: [lakehouse]

  # ---------------------------------------------------------------------------
  # Postgres riêng cho Nessie: nơi lưu "sổ sách" của catalog (bảng nào, ở đâu,
  # lịch sử commit). Khởi động lại container không mất gì.
  # ---------------------------------------------------------------------------
  nessie-db:
    image: postgres:16.4
    container_name: nessie-db
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: ${NESSIE_DB_PASSWORD:-nessie}
      POSTGRES_DB: nessie
    volumes:
      - nessie-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nessie", "-d", "nessie"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    restart: unless-stopped
    networks: [lakehouse]

  # ---------------------------------------------------------------------------
  # Nessie — catalog Iceberg có lịch sử phiên bản kiểu git (branch, commit).
  # Spark và Trino hỏi Nessie "bảng X nằm ở file nào" qua Iceberg REST API.
  # Giao diện web: http://localhost:19120
  # ---------------------------------------------------------------------------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.8
    container_name: nessie
    depends_on:
      nessie-db:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    ports:
      - "19120:19120"
    environment:
      # Lưu metadata vào Postgres thay vì RAM
      nessie.version.store.type: JDBC2
      nessie.version.store.persist.jdbc.datasource: postgresql
      quarkus.datasource.postgresql.jdbc.url: jdbc:postgresql://nessie-db:5432/nessie
      quarkus.datasource.postgresql.username: nessie
      quarkus.datasource.postgresql.password: ${NESSIE_DB_PASSWORD:-nessie}
      # Bảng Iceberg mới được đặt dưới s3://warehouse/
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://warehouse/
      # Cách Nessie kết nối kho S3
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000/
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: admin
      nessie.catalog.secrets.access-key.secret: password
    healthcheck:
      # Cổng quản trị 9000 nằm trong container Nessie, không đụng cổng 9000 của kho S3
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /q/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    restart: unless-stopped
    networks: [lakehouse]

  # ---------------------------------------------------------------------------
  # Kafka (1 node, KRaft). Container khác gọi: kafka:29092; máy bạn gọi: localhost:9092
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168     # giữ tin 7 ngày
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # lưu tin vào volume, tắt/bật không mất
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    mem_limit: 1g
    restart: unless-stopped
    networks: [lakehouse]

  # ---------------------------------------------------------------------------
  # Trino — chạy SQL trên các bảng Iceberg. Giao diện web: http://localhost:8085
  # Dòng lệnh SQL:  docker exec -it trino trino
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:476
    container_name: trino
    depends_on:
      nessie:
        condition: service_healthy
    ports:
      - "8085:8080"
    volumes:
      - ./docker/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      # Heap cố định 2 GB, chừa ~1 GB cho bộ nhớ ngoài heap (đọc S3, Parquet).
      # Mặc định image lấy 80% giới hạn container làm heap -> gần như không chừa gì,
      # truy vấn nặng làm container vượt giới hạn và bị Linux tắt (Trino "still initializing").
      - ./docker/trino/jvm.config:/etc/trino/jvm.config:ro
    mem_limit: 3g
    restart: unless-stopped
    networks: [lakehouse]

  # ===========================================================================
  # REALTIME (profile: realtime)
  # ===========================================================================

  # Phát lại dataset thật (Sparkov fraudTest.csv) vào Kafka theo nhịp thời gian, tua nhanh SPEED lần.
  # Nhớ vị trí đã gửi trong volume producer-state: tắt/bật lại sẽ gửi tiếp, không gửi lại từ đầu.
  producer:
    build: ./data_generator
    image: lakehouse-producer:2.0
    container_name: producer
    profiles: [realtime]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: transactions
      DATA_FILE: /data/sparkov/fraudTest.csv
      SPEED: "3600"              # 1 giờ dữ liệu phát trong 1 giây (1 ngày trong 24 giây)
      MAX_RATE: "300"            # tối đa 300 giao dịch/giây
      INVALID_RATIO: "0.005"     # 0,5%: gửi kèm một bản ghi hỏng để kiểm tra DLQ
      DUPLICATE_RATIO: "0.005"   # 0,5%: gửi trùng 2 lần để kiểm tra bỏ trùng
      RESET: "0"                 # đổi thành "1" để phát lại từ đầu file
    volumes:
      - ./datasets:/data:ro
      - producer-state:/state
    restart: unless-stopped
    mem_limit: 256m
    networks: [lakehouse]

  # Kafka -> Bronze (hợp lệ) + DLQ (lỗi). Chết thì Docker tự chạy lại, đọc tiếp từ checkpoint.
  bronze-stream:
    <<: *spark
    container_name: bronze-stream
    profiles: [realtime]
    command: >
      spark-submit --master local[2] --driver-memory 2g
      --name bronze_ingestion
      /opt/app/spark_jobs/bronze_ingestion.py
    depends_on:
      kafka:
        condition: service_healthy
      nessie:
        condition: service_healthy
    ports:
      - "4040:4040"   # Spark UI của job Bronze
    restart: unless-stopped
    mem_limit: 2560m   # heap 2g + phần ngoài heap của JVM

  # Kafka -> Silver: cùng luật kiểm tra với Bronze, bỏ trùng, HMAC số thẻ, bỏ PII.
  # Đọc Kafka chứ không đọc bảng Bronze: xem docstring của silver_transformation.py
  silver-stream:
    <<: *spark
    container_name: silver-stream
    profiles: [realtime]
    command: >
      spark-submit --master local[2] --driver-memory 2g
      --name silver_transformation
      /opt/app/spark_jobs/silver_transformation.py
    environment:
      <<: *spark-env
      PII_HMAC_KEY: ${PII_HMAC_KEY:-}     # đọc từ file .env
      DEDUP_WATERMARK: 2 hours            # tính theo thời gian giao dịch
    depends_on:
      kafka:
        condition: service_healthy
      nessie:
        condition: service_healthy
    ports:
      - "4041:4040"   # Spark UI của job Silver
    restart: unless-stopped
    mem_limit: 2560m   # heap 2g + phần ngoài heap của JVM

  # ===========================================================================
  # CÔNG CỤ CHẠY MỘT LẦN (profile: jobs)
  # ===========================================================================

  # Mặc định chạy unit test. Có thể chạy lệnh khác, ví dụ:
  #   docker compose --profile jobs run --rm spark-tools spark-sql
  spark-tools:
    <<: *spark
    container_name: spark-tools
    profiles: [jobs]
    command: ["python3", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]
    volumes:
      - ./spark_jobs:/opt/app/spark_jobs:ro
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./tests:/opt/app/tests:ro
      - ./data_generator:/opt/app/data_generator:ro
    restart: "no"
    mem_limit: 2g

  # Nạp lịch sử (fraudTrain.csv, 2019 -> 06/2020) vào Bronze, DLQ và Silver. Chạy lại không trùng.
  #   docker compose --profile jobs run --rm backfill                   # cả file (~1,3 triệu dòng)
  #   docker compose --profile jobs run --rm backfill --month 2019-01   # một tháng
  #   docker compose --profile jobs run --rm backfill --limit 10000     # thử nhanh
  backfill:
    <<: *spark
    container_name: backfill
    profiles: [jobs]
    entrypoint: ["spark-submit", "--master", "local[2]", "--driver-memory", "2g",
                 "--name", "batch_backfill", "/opt/app/spark_jobs/batch_backfill.py"]
    command: []
    environment:
      <<: *spark-env
      PII_HMAC_KEY: ${PII_HMAC_KEY:-}
    volumes:
      - ./spark_jobs:/opt/app/spark_jobs:ro
      - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./datasets:/data:ro
    depends_on:
      nessie:
        condition: service_healthy
    ports:
      - "4042:4040"   # Spark UI của job backfill (chỉ mở khi đang chạy)
    restart: "no"
    mem_limit: 3g

  # Tầng Gold + chấm điểm gian lận (Giai đoạn 3). Đọc Silver, ghi 4 bảng lakehouse.gold.*.
  # Chạy lại bao nhiêu lần cũng được (thay nguyên bảng); model_metrics giữ lịch sử mỗi lần chạy.
  #   docker compose --profile jobs run --rm gold
  gold:
    <<: *spark
    container_name: gold
    profiles: [jobs]
    entrypoint: ["spark-submit", "--master", "local[2]", "--driver-memory", "2g",
                 "--name", "gold_scoring", "/opt/app/spark_jobs/gold_scoring.py"]
    command: []
    environment:
      <<: *spark-env
      SPLIT_TIME: "2020-06-21 12:14:00"   # trước mốc này = TRAIN (học), từ mốc này = TEST (đo)
    depends_on:
      nessie:
        condition: service_healthy
    ports:
      - "4043:4040"   # Spark UI của job Gold (chỉ mở khi đang chạy)
    restart: "no"
    mem_limit: 3g

volumes:
  producer-state:
  kafka-data:
  object-data:
  nessie-db-data:
  spark-checkpoints:

networks:
  lakehouse:
    name: lakehouse
