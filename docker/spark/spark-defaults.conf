# Catalog Iceberg tên "lakehouse", metadata do Nessie quản lý (REST API),
# dữ liệu nằm trên kho S3 (RustFS) ở http://minio:9000.
spark.sql.extensions                               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                   rest
spark.sql.catalog.lakehouse.uri                    http://nessie:19120/iceberg/main/
# Lưu ý: Nessie luôn gửi kèm mỗi bảng io-impl = S3FileIO, ghi đè dòng này.
# Vì vậy không dùng Iceberg làm NGUỒN streaming (xem silver_transformation.py).
spark.sql.catalog.lakehouse.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint            http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access   true
spark.sql.defaultCatalog                           lakehouse

# Giờ UTC cho mọi phép tính thời gian, tránh lệch múi giờ giữa các máy
spark.sql.session.timeZone                         UTC
spark.sql.shuffle.partitions                       4
spark.ui.showConsoleProgress                       false

# TẮT "constraint propagation" của bộ tối ưu Spark. Lý do: lọc bản ghi hợp lệ
# (error_reason IS NULL, với error_reason là chuỗi CASE WHEN của 10 luật) trên 29 cột
# làm bộ tối ưu sinh ra số ràng buộc tăng theo cấp số nhân -> tràn heap NGAY LÚC LẬP KẾ HOẠCH,
# trước cả khi đọc dữ liệu. Tắt đi chỉ bỏ một phép suy luận bộ lọc phụ, kết quả không đổi.
# tests/test_streaming_plan.py giữ cho lỗi này không quay lại.
spark.sql.constraintPropagation.enabled            false
